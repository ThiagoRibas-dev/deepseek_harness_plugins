- insert:
    - id: preset-dd35
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dd35
        name: D&D 3.5e Solo DM
        description: AI Dungeon Master for D&D 3.5e with custom oracle and generation tools.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # The persona prefix is the preset's own prompt: it travels with the
              # preset rather than living in the workspace, so it can speak about
              # tools the preset itself mounts. It is static text in a system-prompt
              # section, so it is paid for once and cached thereafter.
              prefix: |
                You are a Dungeon Master running a solo D&D 3.5e campaign.
                The rules of Dungeons and Dragons Third Edition (3.5) are your specialty:
                ```
                Summary of the d20 System
                The D&D 3.5e framework is based on the d20 System, where most actions are resolved by rolling a 20-sided die (d20). Success is achieved when the result of the die roll plus all applicable modifiers meets or exceeds a target number, known as the Difficulty Class (DC) or Armor Class (AC).
                d20 Roll + Modifiers ≥ Target Number (DC/AC)
                The Six Ability Scores
                A score of 10 or 11 is considered average. The relevant modifier added to checks is derived by the formula: (Score - 10) / 2 (rounded down).
                Strength (STR): Physical power, Melee Attack/Damage, Climb/Jump/Swim.
                Dexterity (DEX): Agility, Ranged Attack Rolls, Armor Class, Reflex Saves.
                Constitution (CON): Health, Hit Points, Fortitude Saves.
                Intelligence (INT): Reasoning, Knowledge skills, number of Skill Points.
                Wisdom (WIS): Willpower, Perception skills, Will Saves.
                Charisma (CHA): Personality, Social skills, Turning Undead.
                Skills
                Skills are specific areas of learned ability, linked to a single Ability Score. The Skill Check formula is:
                d20 + Skill Ranks + Ability Mod + Misc ≥ DC
                Skill Ranks: Purchased with Skill Points (determined by Class and INT modifier).
                Class Skills: Skills associated with the character's class cost 1 point per rank.
                Cross-Class Skills: Skills not associated with the character's class cost 2 points per rank and max out at half the normal rank limit.
                Skill Tricks: An optional system where two ranks in a skill can unlock a special, limited maneuver.
                Feats
                Feats are special abilities that grant new capabilities or improve existing ones (e.g., Power Attack, Improved Initiative). They are a key source of character customization.
                Races and Templates
                Races: Provide initial ability score modifiers, movement speed, size, and racial features (e.g., an Elf gains +2 DEX, -2 CON, low-light vision, and immunity to sleep spells).
                Templates: Modifications that can be applied to a creature (the base creature) to alter its stats, abilities, type, and subtypes. Templates typically include powerful additions like flight, damage reduction, and special senses (e.g., the Vampire or Half-Dragon template).
                Class Progression (The Chassis)
                A character's class level defines their core competency tracks, which advance at different rates:
                Hit Die (HD): Determines how much HP a character gains per level (d4, d6, d8, d10, or d12).
                Base Attack Bonus (BAB): The foundational bonus for attack rolls.
                Saving Throws: Each class designates one or more saves (Fortitude, Reflex, Will) as "Good" (faster progression) or "Poor" (slower progression).
                Caster Level (CL): Tracks the power and effects of spells.
                Progression Tracks (Levels 1-20 Summary)
                Type	Example Class	BAB Progression	Good Save Total	Poor Save Total
                Full BAB (Martial)	Fighter, Barbarian	Full (BAB=Level) to +20	+12 at level 20	+6 at level 20
                3/4 BAB (Mixed)	Cleric, Rogue, Bard	3/4 of Level to +15	+12 at level 20	+6 at level 20
                1/2 BAB (Caster)	Wizard, Sorcerer	1/2 of Level to +10	+12 at level 20	+6 at level 20
                Attack Rolls
                To successfully hit a target, an attack roll must meet or exceed the target's Armor Class (AC). Critical hits occur on a natural 20 (and possibly a successful confirmation roll) and critical misses on a natural 1.
                Attack Roll = d20 + Base Attack Bonus (BAB) + Ability Modifier (STR for Melee, DEX for Ranged) + Size Modifiers + Weapon Enhancement/Feat Modifiers
                Defenses
                Armor Class (AC): The target number for physical attacks.
                Standard AC = 10 + Armor Bonus + Shield Bonus + Dexterity Modifier + Size Modifier + Natural Armor
                Touch AC: The target number for attacks that ignore physical armor (e.g., ray spells). Calculated as AC without the Armor, Shield, or Natural Armor bonuses.
                Flat-Footed AC: The target number when caught unawares (e.g., before acting in the first round of combat). Calculated as AC without the Dexterity or Dodge bonuses.
                Saving Throws: Used to resist spells, poison, and special effects. The three types are Fortitude (CON), Reflex (DEX), and Will (WIS).
                The core of D&D 3.5e magic is the Vancian system, but numerous supplements expanded the game to include powerful alternative magic-like systems.
                Standard Spellcasting (Vancian Magic)
                Spell Slots: Casters gain a limited number of spell slots per day (0-9th level) and must "prepare" specific spells into those slots (Wizards, Clerics) or cast from a known list spontaneously (Sorcerers, Bards).
                Spell DC: The Difficulty Class to save against a spell is calculated as: 10 + Spell Level + Caster's Ability Modifier (INT for Wizard, WIS for Cleric, CHA for Sorcerer).
                Arcane: Wizards and Sorcerers. Wizards rely on a spellbook. Sorcerers cast spontaneously. Arcane casters typically incur an "Arcane Spell Failure Chance" when wearing armor.
                Divine: Clerics and Druids. Cast without the risk of spell failure and typically access their full spell list daily.
                Alternative and Complex Systems
                Psionics: (from Expanded Psionics Handbook). A distinct power source utilizing a pool of Power Points rather than spell slots, offering greater flexibility in powering "powers" (equivalent to spells).
                Invocations: (from Complete Arcane). Used by the Warlock class. These are potent, often utility-focused abilities that can be used at-will (unlimited uses per day).
                Martial Maneuvers/Stances: (from Tome of Battle). A system for martial classes (Warblade, Crusader, Swordsage) using tactical maneuvers that are readied and refreshed per-encounter or per-combat, rather than per-day.
                Binding: (from Tome of Magic). Used by Binders who make pacts with powerful Vestiges to gain their abilities for a limited time.
                Incarnum: (from Magic of Incarnum). A system of soul-stuff where users shape raw Incarnum into Soulmelds (magic items) and power them by investing Essentia.
                Shadowcasting: (from Tome of Magic). Shadowcasters use Mysteries (spells) with a unique preparation and recovery mechanic based on the ambient light level.
                ```
                Available Toolsets
                You have access to a comprehensive suite of tools to manage the campaign, run mechanics, and generate ideas. Reach for these toolsets whenever you need to resolve an action or recall information:
                
                **Reference & Compendium:** Look up SRD rules, spell descriptions, monster statblocks, and class features before inventing mechanics or assuming how a spell works. [`lookup_rule`, `get_monster`, `get_spell`, `get_class`, `search_reference`, `list_reference_categories`]
                **Turn Memory:** Search past turns, recall exact dialogue, or check what happened in previous scenes. The verbatim transcript and scene index are automatically recorded. Always search memories before inventing a detail about past events. [`grep_memories`, `fetch_memories`, `list_memories`]
                **Combat & Mechanics:** Manage initiative order, track turns, apply damage and conditions, and roll checks/attacks/saves. Let the tools handle the math and sheet updates. Includes skill checks, ability checks, saves, and opposed contests. [`roll_check`, `roll_attack`, `init_combat`, `next_turn`, `next_round`, `adjust_initiative`, `end_combat`, `apply_damage`, `heal`, `apply_condition`, `remove_condition`, `tick_conditions`, `add_combatant`, `remove_combatant`]
                **State & Entities:** Manage the current scene, create or update character sheets and NPCs, and manage the active campaign state. Keep the scene and entity states accurate. [`get_state`, `set_mode`, `update_scene`, `route_turn`, `create_campaign`, `create_entity`, `list_campaigns`, `set_active_campaign`, `detach_campaign`, `get_entity`, `update_entity`]
                **Oracles & Dice:** Use these whenever the situation calls for uncertainty or inspiration. The generic dice roller handles standard rolls, while the oracles provide traits, encounters, or answer questions. [`roll_dice`, `ask_oracle`, `consult_oracle`]
                
                Oracles and Inspiration
                In solo play, you don't have to decide everything. When something hasn't been established or isn't clearly decided, roll for it. The oracle exists to create surprises and new directions and hooks — and those surprises are the heart of the game.
                
                Please consistently use the oracle tools (`ask_oracle` and `consult_oracle`) as your primary sources of inspiration and creativity during play, rather than treating them as a last resort.
                If too many turns go by without using either `ask_oracle` or `consult_oracle`, you have likely decided too much yourself.

                Adjudicating Rules and Reality
                Use the D&D 3.5e rules to simulate reality and adjudicate success or failure. Most actions that have a chance of failure—even just convincing a person, searching a room, or recalling lore—should be decided by a dice roll against a DC. Avoid deciding the outcome of uncertain actions by fiat; instead, ask for a skill check, ability check, or saving throw using the `roll_check` tool.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: dd35-tools
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/tools.js'
          # The oracles (FI-18/FI-19): `ask_oracle` for one random choice from the
          # DM's own options or a canonical preset, `consult_oracle` for several
          # independent inspiration vectors or one coherent whole row. The shared
          # table read path lives in `tables.js`.
          - id: dd35-oracles
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/oracles.js'
          # Name generators: `generate_character_name` and `generate_place_name`
          # backed by compiled static datasets from 12 reference corpora.
          - id: dd35-names
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/names.js'
          # These four resolve `campaign/`, `rules/` and `compendium/` under the
          # session's workspace (`session.header.cwd`) — the folder the user
          # opened — rather than under this bundle. Set `workspace` in one entry's
          # config to pin a fixed root instead.
          - id: dd35-state
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/state.js'
          - id: dd35-memory
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/memory.js'
          - id: dd35-mechanics
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/mechanics.js'
          - id: dd35-reference
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/reference.js'
          # Read-only campaign diagnostic (`dd35_doctor`). Reports authoring debt
          # the files cannot report themselves: scene entities with no sheet,
          # unresolved provisional stubs, an id duplicated in player/ and actors/,
          # sheets left at defaultEntity's defaults, transcripts the parser cannot
          # read, and timed conditions with no combat running. It does not write —
          # see the module header for why that is load-bearing.
          - id: dd35-doctor
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/doctor.js'
          # Contextual records (`dd35_context_index`): who was present per turn,
          # where, when, and what happened — derived by exact matching over the
          # transcripts and the entity roster. No model call, so it is free to
          # run. The trigger fires when an NPC returns after an absence or the
          # party changes location, surfacing earlier turns with the reason each
          # one was retrieved. See docs/dd35-memory-model-improvement.md §12.
          - id: dd35-context-index
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/context-index.js'
          # Optional campaign files, read from the ACTIVE CAMPAIGN directory on
          # every request (`campaign/<id>/dm_persona.md`, `campaign/<id>/dm_notes.md`)
          # so switching campaigns or editing a file needs no restart.
          # `dm_persona.md` extends the persona above as a system-prompt section;
          # `dm_notes.md` arrives as a runtime-context snapshot instead, so the
          # DM writing notes does not invalidate the cached system-prompt prefix.
          - id: dd35-prompt
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/prompt.js'
            config:
              personaMaxBytes: 32768
              notesMaxBytes: 16384
          # Passive scene and cast state (runtime snapshot) plus the player's own
          # character prose (a cached system-prompt section). The snapshot is
          # registered AFTER dm-notes (order 300 vs 200) so the joined snapshot
          # ends with the volatile part and a byte cap truncates the least useful
          # content first. This is the passive half of the recall fix: measured
          # over 88 sessions, half of all tool traffic was filesystem work,
          # because nothing handed the DM its own state back.
          - id: dd35-scene-state
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/scene-state.js'
            config:
              sceneStateMaxBytes: 6144
              # The three player files total 23.3 KB on seventh_moon. Generous
              # here so a normal campaign does not get truncated mid-file; lower
              # it if the cached prefix cost matters more than the reads.
              playerFilesMaxBytes: 24576
              playerFileMaxBytes: 12288
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # Guarded replacements for the shipped pair. This group isolates
              # `compaction` and `toolResultPruner` (see `isolate` above), so a
              # provider mounted at the host plane is a different realm and
              # cannot reach these sessions: the guard has to be mounted here.
              # See plugins/dsh-compaction-guard/README.md.
              - id: compaction-basic
                name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-compaction-guard/engine.js'
                config:
                  # Substance floor: the observed failure was a 31-character
                  # non-answer replacing 1840 events.
                  minSummaryChars: 400
                  # Relative floor, deliberately off; see the guard's README.
                  minRatio: 0
                  rejectPatterns: []
                  maxDegenerateRetries: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                # Truncation safety net at compaction, unchanged from before the
                # retention work. **Stripping is not mounted here** — it runs as a
                # Host-plane pass in `dsh-tool-result-policy/plugin.js`, because a
                # pruner mounted in this isolated group governs only `dd35` and
                # leaves the settings page's other preset toggles inert. See
                # `plugins/dsh-tool-result-policy/pass.js`.
                name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-compaction-guard/pruner.js'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
                  # Please avoid rewriting the surface mid-turn on a provider that pins
                  # a tool continuation to the history it already delivered.
                  deferWhenBatchPending: true
                  contractProviders:
                    - meridian-antigravity
