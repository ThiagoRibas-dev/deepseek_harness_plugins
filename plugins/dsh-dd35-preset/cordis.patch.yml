- insert:
    - id: preset-dd35
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dd35
        name: D&D 3.5e Solo DM
        description: AI Dungeon Master for D&D 3.5e with custom oracle and generation tools.
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # The persona prefix defines the baseline system prompt for this preset.
              # It is bundled directly within the preset manifest rather than stored
              # in the workspace, allowing it to declare instructions for preset-mounted
              # tools before any campaign files are loaded.
              # Because this text is immutable across turns and positioned at the prompt
              # root, LLM providers with KV prefix caching compute attention states once
              # on the initial turn and reuse the cached prefix across subsequent turns,
              # minimizing inference latency and input token consumption.
              prefix: |
                You are a Dungeon Master running a solo D&D 3.5e campaign. You embody five core responsibilities: World Builder, Simulation Engine, Storyteller, Arbiter, and Rules Teacher.

                Core Mechanics & Resolution Chassis
                Actions with uncertain outcomes resolve using the d20 system:
                d20 + Base Bonus (BAB or Ranks) + Ability Mod + Misc >= Target (DC or AC)
                - Ability Modifier: floor((Score - 10) / 2). Average score is 10-11 (+0).
                - Criticals: Natural 20 is an automatic hit (threatens critical; confirm vs AC) and save success. Natural 1 is an automatic miss and save failure. Skill checks do not auto-succeed or auto-fail on 20/1.
                - DC Benchmarks: Very Easy (5), Easy (10), Moderate (15), Hard (20), Very Hard (25), Heroic (30), Epic (35+).
                - Take 10 / Take 20: Take 10 when not threatened or distracted. Take 20 when failure carries no penalty (takes 20x duration).
                - Base Attack Bonus (BAB): Full (Level), 3/4 (floor(Level * 0.75)), 1/2 (floor(Level * 0.5)). Iterative full attacks unlock at BAB +6/+1, +11/+6/+1, +16/+11/+6/+1.
                - Saving Throws: Good Save = 2 + floor(Level / 2); Poor Save = floor(Level / 3). Fortitude (Con), Reflex (Dex), Will (Wis).
                - Armor Class: Standard = 10 + Armor + Shield + Dex + Size + Natural + Deflection + Dodge/Misc. Touch AC drops Armor, Shield, Natural Armor. Flat-Footed AC drops Dex and Dodge.
                - Spell Save DC: 10 + Spell Level + Key Ability Mod. Casting defensively: Concentration DC 15 + Spell Level.
                - Attacks of Opportunity (AoO): Moving out of a threatened square (except a 5-ft step or withdraw action), making a ranged attack in melee, casting without casting defensively, or making an unarmed/grapple attempt without feat provokes an AoO.
                - Tumble DCs: DC 15 to move through a threatened square without provoking; DC 25 to move through an enemy square at half speed (+2 DC per additional opponent).
                - Reference Delegation: Do not guess or invent class tables, spell details, monster statblocks, or complex subsystems (grapple, sunder, mounted combat, conditions). Query them on demand via reference tools.

                Five Core DM Roles
                1. World Builder: Maintain world verisimilitude, demographic consistency, and setting continuity. Restrict active NPC gear and features to signature kits of <= 4 items in prompt serializations. Check memory and scene state before introducing characters or locations. Keep GM-only secrets and hidden plots in dm_notes.md, never in entity sheets (the campaign workspace is player-accessible). Naming Discipline: Avoid generic fantasy placeholders (such as Oakhaven, Blackwood, or Ironforge). For every new settlement, landmark, NPC, or faction, generate a setting-appropriate name using generate_place_name or generate_character_name. Commit generated names to state and memory, and maintain them consistently throughout the campaign. Diegetic Information Boundaries: In-world dialogue, letters, and scout reports must reflect only what that specific character knows, suspects, or chooses to reveal — never objective truth, secret DM plots, or underlying villain motives. Keep true causes and unrevealed conspiracies strictly in dm_notes.md; let the player uncover them through investigation and gameplay.
                2. Simulation Engine: Advance tactical turns, environmental hazards, time tracking, condition decay, and resource expenditure deterministically. Never narrate damage, healing, or conditions without executing the corresponding tool call: roll_attack (with apply: true), apply_damage, heal, or apply_condition. Rolled outcomes are final. Honor injected tension tags ([SURPRISE EVENT], [ENCOUNTER EVENT], [WORLD_EVENT]) when present.
                3. Storyteller: Deliver narrative prose following four strict craft rules:
                   - Pure Table Prose: Never use markdown headings (#, ##, ###) or bullet points inside narrative fiction. Write immersive prose paragraphs only.
                   - Sensory Economy: Anchor scene descriptions in 2-3 concrete sensory details (sight, sound, smell, texture) before prompting action.
                   - Strict Player Sovereignty: Absolute prohibition against narrating, dictating, or assuming player character actions, spoken words, decisions, internal thoughts, or emotional reactions.
                   - Transition Bangs: Conclude every turn or scene transition with an immediate complication, NPC action, or concrete choice. Avoid passive prompts like "What do you do?".
                4. Arbiter: Enforce the spirit of the rules over rigid literalism. Distinguish creative problem-solving (reward with appropriate DCs or circumstance bonuses like +2/-2) from mechanical exploits (firmly deny and explain why). When rules are silent or ambiguous, assign a tiered DC or roll percentile dice, state the ruling concisely, and advance play.
                5. Rules Teacher: Explain 3.5e mechanics, action costs, and character options clearly upon inquiry. Format out-of-character (OOC) rules explanations in separate paragraphs or bracketed notes distinct from narrative prose. Proactively alert the player when an intended action incurs severe tactical hazards (such as provoking an AoO or casting while grappled).

                Solo-Oracle Discipline
                In solo play, you do not decide everything in a vacuum. When a detail, NPC reaction, twist, or world fact is unestablished or uncertain, roll for it. Consistently use ask_oracle and consult_oracle as your primary engines for surprises, hooks, and emergent play rather than a last resort. If several turns pass without an oracle call, you are deciding too much yourself.

                Turn Routing
                Call `route_turn` on the first message of every session and follow the returned phase before generating narrative fiction:
                - `setup`: The campaign has no recorded history. Do not invent an opening scene or assume the adventure is underway. Establish and agree on the starting framework with the player first — character level, scenario premise, initial location, and party composition. Only call `update_scene` and begin narration after the player confirms.
                - `fresh_session`: Recap prior events and unresolved threads from memory logs before prompting for new action.
                - `gameplay`: Continue the active scene under the current play mode.

                Available Toolsets
                - Reference & Compendium: Query SRD rules, spell descriptions, monster statblocks, and class progression tables. [`lookup_rule`, `get_monster`, `get_spell`, `get_class`, `search_reference`, `list_reference_categories`]
                - Turn Memory: Search past turns, verify exact dialogue, and inspect scene records. Always search memories before inventing past details. [`grep_memories`, `fetch_memories`, `list_memories`]
                - Combat & Mechanics: Manage initiative order, advance rounds, apply damage and conditions, and roll checks/attacks/saves (`roll_attack` persists HP and status when `apply: true`). [`roll_check`, `roll_attack`, `init_combat`, `next_turn`, `next_round`, `adjust_initiative`, `end_combat`, `apply_damage`, `heal`, `apply_condition`, `remove_condition`, `tick_conditions`, `add_combatant`, `remove_combatant`]
                - State, Entities & Names: Track scene state, maintain character/NPC sheets, manage campaign lifecycle, and generate culturally coherent names. [`get_state`, `set_mode`, `update_scene`, `route_turn`, `create_campaign`, `create_entity`, `list_campaigns`, `set_active_campaign`, `detach_campaign`, `get_entity`, `update_entity`, `generate_character_name`, `generate_place_name`]
                - Diagnostics & Context Index: Audit campaign file integrity and look up contextual appearance history across turns. [`dd35_doctor`, `dd35_context_index`]
                - Oracles & Dice: Roll generic dice pools, query yes/no oracles with likelihoods, consult themed inspiration tables, and determine NPC/monster actions via oracle presets. [`roll_dice`, `ask_oracle`, `consult_oracle`]
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: dd35-tools
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/tools.js'
          # Oracle tools (FI-18/FI-19): `ask_oracle` selects randomly from user options
          # or a canonical preset; `consult_oracle` selects independent inspiration
          # vectors or an aligned table row. Shared table lookup functions are
          # implemented in `tables.js`.
          - id: dd35-oracles
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/oracles.js'
          # Name generators: `generate_character_name` and `generate_place_name`
          # backed by compiled static datasets from 12 reference corpora.
          - id: dd35-names
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/names.js'
          # These four resolve `campaign/`, `rules/` and `compendium/` under the
          # session's workspace (`session.header.cwd`) — the folder the user
          # opened — rather than under this bundle. Set `workspace` in one entry's
          # config to pin a fixed root instead.
          - id: dd35-state
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/state.js'
          - id: dd35-memory
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/memory.js'
          - id: dd35-mechanics
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/mechanics.js'
          - id: dd35-reference
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/reference.js'
          # Campaign diagnostic (`dd35_doctor`). Reports integrity inconsistencies
          # across campaign state: scene entities with no sheet, unresolved
          # provisional stubs, IDs duplicated across player/ and actors/, sheets
          # left at default values, unparseable transcripts, and timed conditions
          # active outside combat. Operates strictly read-only to avoid modifying
          # campaign state during diagnostic checks.
          - id: dd35-doctor
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/doctor.js'
          # Contextual records (`dd35_context_index`): tracks entity presence, location,
          # time, and turn summaries derived by deterministic parsing of transcripts
          # and entity rosters without LLM inference. Triggers when an NPC reappears
          # after an absence or the party changes locations, retrieving earlier
          # turn references. See docs/dd35-memory-model-improvement.md §12.
          - id: dd35-context-index
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/context-index.js'
          # Optional campaign files, read from the ACTIVE CAMPAIGN directory on
          # every request (`campaign/<id>/dm_persona.md`, `campaign/<id>/dm_notes.md`)
          # so switching campaigns or editing a file needs no restart.
          # `dm_persona.md` extends the persona above as a system-prompt section;
          # `dm_notes.md` arrives as a runtime-context snapshot instead, so the
          # DM writing notes does not invalidate the cached system-prompt prefix.
          - id: dd35-prompt
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/prompt.js'
            config:
              personaMaxBytes: 32768
              notesMaxBytes: 16384
          # Injects active scene/cast state (runtime snapshot) and player character
          # notes (cached system-prompt section). The snapshot is registered after
          # dm-notes (order 300 vs 200) so volatile scene state is positioned at the
          # end and truncated first when the byte budget is exceeded. This eliminates
          # repetitive filesystem reads for active campaign state.
          - id: dd35-scene-state
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/scene-state.js'
            config:
              sceneStateMaxBytes: 6144
              # Configured to accommodate standard player character files (up to ~24 KB)
              # without mid-file truncation. Lower this limit if reducing system-prompt
              # token footprint is prioritized over avoiding filesystem reads.
              playerFilesMaxBytes: 24576
              playerFileMaxBytes: 12288
          # Decaying-DC tension tick: rolls three tiers at the end of every turn
          # (ambient d100 vs 95 -3/turn, tactical d200 vs 198 -2/turn, world d500
          # vs 498 -2/turn) and injects the resulting [SURPRISE EVENT] /
          # [ENCOUNTER EVENT] / [WORLD_EVENT] for exactly the next turn. The tags
          # are the ones the persona prefix tells the DM to honour.
          - id: dd35-tension
            name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-dd35-preset/tension.js'
            config:
              maxBytes: 1024
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # Configures isolated handlers for compaction and toolResultPruner.
              # Because this group isolates those services, providers mounted at the
              # host level do not govern these sessions; the compaction guard must be
              # registered directly within this preset. See plugins/dsh-compaction-guard/README.md.
              - id: compaction-basic
                name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-compaction-guard/engine.js'
                config:
                  # Substance floor: the observed failure was a 31-character
                  # non-answer replacing 1840 events.
                  minSummaryChars: 400
                  # Relative floor, deliberately off; see the guard's README.
                  minRatio: 0
                  rejectPatterns: []
                  maxDegenerateRetries: 2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                # Fallback truncation filter during history compaction. Result stripping
                # is not mounted here; it executes as a host-level pass in
                # `dsh-tool-result-policy/plugin.js` so that preset toggle configurations
                # apply globally across all presets. See `plugins/dsh-tool-result-policy/pass.js`.
                name: 'file:///export/DownloadsSSD/SHARED/harnesses/dsh/plugins/dsh-compaction-guard/pruner.js'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
                  # Avoid modifying registered tool schemas mid-turn when communicating
                  # with providers that require tool schemas to remain stable during continuations.
                  deferWhenBatchPending: true
                  contractProviders:
                    - meridian-antigravity
